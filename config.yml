backend:
  name: github
  repo: brandaiagent/my-page
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "쇼핑 포스팅"
    folder: "" # 폴더 안이 아닌 메인 위치(루트)에 글 생성
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "발행일", name: "date", widget: "datetime" }
      - { label: "카테고리", name: "category", widget: "string", required: false, hint: "예: 주방용품, 생활가전, 뷰티" }
      - { label: "요약문", name: "description", widget: "text", required: false, hint: "검색 결과에 보일 한두 문장 (80자 안팎)" }
      - { label: "썸네일 이미지", name: "image", widget: "image", required: false }
      - { label: "본문 내용", name: "body", widget: "markdown" }

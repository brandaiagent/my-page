<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Ai Agent - 쇼핑 큐레이션</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
    }

    /* GNB 상단바 */
    .gnb {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .gnb-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px 24px;
    }

    /* 히어로 비주얼 */
    .hero {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      padding: 48px 36px;
      border-radius: 20px;
      margin-bottom: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .hero-badge {
      display: inline-block;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .hero-sub {
      font-size: 1rem;
      color: #94a3b8;
    }

    /* 카드 그리드 레이아웃 */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.08);
    }
    .card-thumb {
      width: 100%;
      height: 180px;
      background-color: #cbd5e1;
      background-size: cover;
      background-position: center;
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 상세 본문 스타일 */
    .back-btn {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .detail-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 800px;
      margin: 0 auto;
    }
    .detail-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
    }
    #content-area img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 24px auto;
    }
  </style>
</head>
<body>

  <nav class="gnb">
    <div class="gnb-inner">
      <div class="logo" onclick="goHome()">Brand Ai Agent</div>
      <div class="nav-links">
        <a href="/admin" target="_blank">글쓰기(CMS)</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <header class="hero" id="hero-section">
      <div class="hero-badge">SMART SHOPPING</div>
      <h1 class="hero-title">후기 검증 완료!<br>최저가 가성비 꿀템 모음</h1>
      <p class="hero-sub">엄선된 상품 정보와 최저가 할인 소식을 모아드립니다.</p>
    </header>

    <main id="app">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">포스팅을 불러오는 중...</div>
    </main>
  </div>

  <script>
    const postFiles = [
      { 
        name: "post.md", 
        path: "./post.md", 
        title: "2026년 추천 가성비 로봇청소기 TOP 3", 
        tag: "가전/디지털",
        thumb: "https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=600&q=80"
      },
      { 
        name: "가성비-밀키트-탑-3.md", 
        path: "./posts/가성비-밀키트-탑-3.md", 
        altPath: "./가성비-밀키트-탑-3.md", 
        title: "가성비 밀키트 탑 3 추천 목록", 
        tag: "밀키트/식품",
        thumb: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80"
      }
    ];

    function renderList() {
      const hero = document.getElementById('hero-section');
      if (hero) hero.style.display = 'block';
      
      const app = document.getElementById('app');
      let html = '<div class="post-grid">';
      
      postFiles.forEach((post, index) => {
        html += `
          <article class="post-card" onclick="viewPost(${index})">
            <div class="card-thumb" style="background-image: url('${post.thumb}');"></div>
            <div class="card-body">
              <span class="card-tag">${post.tag}</span>
              <h2 class="card-title">${post.title}</h2>
              <div class="card-footer">
                <span>발행 완료</span>
                <span style="color:var(--primary); font-weight:bold;">읽어보기 &rarr;</span>
              </div>
            </div>
          </article>
        `;
      });
      
      html += '</div>';
      app.innerHTML = html;
    }

    async function viewPost(index) {
      const hero = document.getElementById('hero-section');
      if (hero) hero.style.display = 'none';
      
      const app = document.getElementById('app');
      const post = postFiles[index];
      app.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">본문을 읽어오는 중...</div>';
      
      let text = '';
      try {
        let res = await fetch(post.path);
        if (!res.ok && post.altPath) {
          res = await fetch(post.altPath);
        }
        if (!res.ok) throw new Error('파일 없음');
        text = await res.text();
      } catch (e) {
        app.innerHTML = `
          <div class="back-btn" onclick="goHome()">&larr; 목록으로 돌아가기</div>
          <div style="text-align:center; color:#ef4444; padding: 40px;">본문을 불러오지 못했습니다.</div>
        `;
        return;
      }

      const parts = text.split('---');
      let markdownBody = parts.length >= 3 ? parts.slice(2).join('---') : text;

      markdownBody = markdownBody.replace(/src=["']?images\//g, 'src="./images/')
                                 .replace(/\]\(\s*images\//g, '](./images/')
                                 .replace(/\]\(\s*\/images\//g, '](./images/');

      const htmlContent = window.marked ? marked.parse(markdownBody) : markdownBody;

      app.innerHTML = `
        <div class="back-btn" onclick="goHome()">&larr; 목록으로 돌아가기</div>
        <article class="detail-container">
          <span class="card-tag">${post.tag}</span>
          <h1 class="detail-title">${post.title}</h1>
          <div id="content-area">${htmlContent}</div>
        </article>
      `;
      window.scrollTo(0, 0);
    }

    function goHome() {
      renderList();
      window.scrollTo(0, 0);
    }

    renderList();
  </script>
</body>
</html>

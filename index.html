<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Ai Agent - 쇼핑 큐레이션</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .gnb {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .gnb-top {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }
    .admin-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
    }
    .gnb-nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 32px;
    }
    .nav-item {
      padding: 12px 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .nav-item.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px 24px;
    }
    .promo-banner {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
      box-shadow: 0 10px 25px rgba(37,99,235,0.2);
    }
    .promo-banner h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
    .promo-banner p { font-size: 1.05rem; opacity: 0.9; }
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
    }
    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }
    .card-thumb {
      width: 100%;
      height: 190px;
      background-color: #e2e8f0;
      background-size: cover;
      background-position: center;
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .price-tag {
      font-weight: 800;
      color: #e11d48;
      font-size: 1rem;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .detail-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 820px;
      margin: 0 auto;
    }
    .detail-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
    }
    #content-area img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 24px auto;
    }
  </style>
</head>
<body>

  <header class="gnb">
    <div class="gnb-top">
      <a class="logo" onclick="goHome()">Brand Ai Agent</a>
      <a class="admin-link" href="/admin" target="_blank">관리자(CMS)</a>
    </div>
    <div class="gnb-nav">
      <div class="nav-item active" onclick="filterCategory('전체', this)">전체 상품</div>
      <div class="nav-item" onclick="filterCategory('가전/디지털', this)">가전/디지털</div>
      <div class="nav-item" onclick="filterCategory('밀키트/식품', this)">밀키트/식품</div>
    </div>
  </header>

  <div class="container">
    <section class="promo-banner" id="promo-section">
      <h2>🔥 2026 Brand Ai Agent 특가전</h2>
      <p>광고 없는 내돈내산 추천 알고리즘으로 엄선된 쇼핑 큐레이션</p>
    </section>

    <main id="app">
      <div style="text-align: center; padding: 60px; color: var(--text-muted);">상품을 불러오는 중...</div>
    </main>
  </div>

  <script>
    const posts = [
      { 
        name: "post.md", 
        path: "./post.md", 
        title: "2026년 추천 가성비 로봇청소기 TOP 3", 
        tag: "가전/디지털",
        price: "최저 29만원대~",
        thumb: "https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=600&q=80"
      },
      { 
        name: "가성비-밀키트-탑-3.md", 
        path: "./posts/가성비-밀키트-탑-3.md", 
        altPath: "./가성비-밀키트-탑-3.md", 
        title: "가성비 밀키트 탑 3 추천 목록", 
        tag: "밀키트/식품",
        price: "1만원대 구성",
        thumb: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let currentCategory = '전체';

    function renderList(category = '전체') {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'block';
      
      const app = document.getElementById('app');
      const filtered = category === '전체' ? posts : posts.filter(p => p.tag === category);

      let html = '<div class="post-grid">';
      filtered.forEach((post) => {
        const originalIndex = posts.indexOf(post);
        html += `
          <article class="post-card" onclick="viewPost(${originalIndex})">
            <div class="card-thumb" style="background-image: url('${post.thumb}');"></div>
            <div class="card-body">
              <span class="card-tag">${post.tag}</span>
              <h2 class="card-title">${post.title}</h2>
              <div class="card-footer">
                <span class="price-tag">${post.price}</span>
                <span style="color:var(--primary); font-weight:700;">상세보기 &rarr;</span>
              </div>
            </div>
          </article>
        `;
      });
      html += '</div>';
      app.innerHTML = html;
    }

    function filterCategory(category, el) {
      currentCategory = category;
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
      renderList(category);
    }

    async function viewPost(index) {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'none';
      
      const app = document.getElementById('app');
      const post = posts[index];
      app.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-muted);">상세 정보를 불러오는 중...</div>';
      
      let text = '';
      try {
        let res = await fetch(post.path);
        if (!res.ok && post.altPath) {
          res = await fetch(post.altPath);
        }
        if (!res.ok) throw new Error('파일 없음');
        text = await res.text();
      } catch (e) {
        app.innerHTML = `
          <div class="back-btn" onclick="goHome()">&larr; 목록으로 돌아가기</div>
          <div style="text-align:center; color:#ef4444; padding: 40px;">본문을 불러오지 못했습니다.</div>
        `;
        return;
      }

      const parts = text.split('---');
      let markdownBody = parts.length >= 3 ? parts.slice(2).join('---') : text;

      markdownBody = markdownBody.replace(/src=["']?images\//g, 'src="./images/')
                                 .replace(/\]\(\s*images\//g, '](./images/')
                                 .replace(/\]\(\s*\/images\//g, '](./images/');

      const htmlContent = window.marked ? marked.parse(markdownBody) : markdownBody;

      app.innerHTML = `
        <div class="back-btn" onclick="goHome()">&larr; 목록으로 돌아가기</div>
        <article class="detail-container">
          <span class="card-tag">${post.tag}</span>
          <h1 class="detail-title">${post.title}</h1>
          <div id="content-area">${htmlContent}</div>
        </article>
      `;
      window.scrollTo(0, 0);
    }

    function goHome() {
      renderList(currentCategory);
      window.scrollTo(0, 0);
    }

    renderList();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Ai Agent - 쇼핑 큐레이션</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .gnb {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .gnb-top {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }
    .admin-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px 24px;
    }
    .promo-banner {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
      box-shadow: 0 10px 25px rgba(37,99,235,0.2);
    }
    .promo-banner h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
    .promo-banner p { font-size: 1.05rem; opacity: 0.9; }
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
    }
    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .detail-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 820px;
      margin: 0 auto;
    }
    .detail-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
    }
    #content-area img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 24px auto;
    }
  </style>
</head>
<body>

  <header class="gnb">
    <div class="gnb-top">
      <a class="logo" onclick="goHome()">Brand Ai Agent</a>
      <a class="admin-link" href="/admin" target="_blank">관리자(CMS)</a>
    </div>
  </header>

  <div class="container">
    <section class="promo-banner" id="promo-section">
      <h2>🔥 Brand Ai Agent 쇼핑 큐레이션</h2>
      <p>실제 저장소의 최신 글을 실시간으로 가져옵니다.</p>
    </section>

    <main id="app">
      <div style="text-align: center; padding: 60px; color: var(--text-muted);">글 목록을 조회 중입니다...</div>
    </main>
  </div>

  <script>
    let activePosts = [];

    async function loadRealPosts() {
      const app = document.getElementById('app');
      try {
        // 실제 저장소 루트 및 posts 폴더 내 .md 파일 탐색
        const resRoot = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/');
        const filesRoot = resRoot.ok ? await resRoot.json() : [];
        
        let filesPosts = [];
        try {
          const resPosts = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/posts');
          if (resPosts.ok) filesPosts = await resPosts.json();
        } catch (e) {}

        const allFiles = [...(Array.isArray(filesRoot) ? filesRoot : []), ...(Array.isArray(filesPosts) ? filesPosts : [])];
        const mdFiles = allFiles.filter(f => f.name && f.name.endsWith('.md') && f.name !== 'README.md');

        if (mdFiles.length === 0) {
          app.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-muted);">등록되거나 삭제되지 않은 글이 없습니다.</div>';
          return;
        }

        activePosts = [];
        for (const file of mdFiles) {
          const contentRes = await fetch(file.download_url);
          const text = await contentRes.text();
          
          const titleMatch = text.match(/title:\s*["']?(.*?)["']?$/m) || text.match(/^#\s+(.*)$/m);
          const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
          
          activePosts.push({
            name: file.name,
            downloadUrl: file.download_url,
            title: title,
            text: text
          });
        }

        renderGrid();
      } catch (err) {
        app.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-muted);">글 목록 불러오기 실패</div>';
      }
    }

    function renderGrid() {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'block';

      const app = document.getElementById('app');
      let html = '<div class="post-grid">';
      
      activePosts.forEach((post, idx) => {
        html += `
          <article class="post-card" onclick="viewPost(${idx})">
            <div class="card-body">
              <span class="card-tag">큐레이션</span>
              <h2 class="card-title">${post.title}</h2>
              <div class="card-footer">
                <span>발행 완료</span>
                <span style="color:var(--primary); font-weight:bold;">상세보기 &rarr;</span>
              </div>
            </div>
          </article>
        `;
      });
      html += '</div>';
      app.innerHTML = html;
    }

    function viewPost(idx) {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'none';

      const app = document.getElementById('app');
      const post = activePosts[idx];

      const parts = post.text.split('---');
      let markdownBody = parts.length >= 3 ? parts.slice(2).join('---') : post.text;

      markdownBody = markdownBody.replace(/src=["']?images\//g, 'src="./images/')
                                 .replace(/\]\(\s*images\//g, '](./images/')
                                 .replace(/\]\(\s*\/images\//g, '](./images/');

      const htmlContent = window.marked ? marked.parse(markdownBody) : markdownBody;

      app.innerHTML = `
        <div class="back-btn" onclick="renderGrid()">&larr; 목록으로 돌아가기</div>
        <article class="detail-container">
          <h1 class="detail-title">${post.title}</h1>
          <div id="content-area">${htmlContent}</div>
        </article>
      `;
      window.scrollTo(0, 0);
    }

    function goHome() {
      renderGrid();
      window.scrollTo(0, 0);
    }

    loadRealPosts();
  </script>
</body>
</html>

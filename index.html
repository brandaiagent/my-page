<html lang="ko">

  <title>가성비 쇼핑 큐레이션</title>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
    }

    /* GNB 상단바 */
    .gnb {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .gnb-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px 24px;
    }

      color: #ffffff;
      padding: 48px 36px;
      border-radius: 20px;
      margin-bottom: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

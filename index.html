<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가성비 쇼핑 큐레이션</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 10px; }
    p.sub { text-align: center; color: #666; margin-bottom: 40px; }
    .post-card { border: 1px solid #eee; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; }
    .post-card:hover { transform: translateY(-2px); }
    .post-title { font-size: 1.25rem; font-weight: bold; margin: 0 0 8px 0; text-decoration: none; color: #111; display: block; }
    .post-date { font-size: 0.85rem; color: #888; }
    hr { border: none; border-top: 2px solid #2563eb; margin-bottom: 40px; }
  </style>
</head>
<body>
  <h1>가성비 쇼핑 큐레이션</h1>
  <p class="sub">엄선한 가성비 꿀템과 최저가 할인 정보를 모아드립니다.</p>
  <hr />
  <div id="posts-container">글을 불러오는 중입니다...</div>

  <script>
    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        // GitHub API로 저장소 루트 및 posts 폴더 내 파일 목록 가져오기
        const resRoot = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/');
        const filesRoot = await resRoot.json();
        
        let filesPosts = [];
        try {
          const resPosts = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/posts');
          if (resPosts.ok) filesPosts = await resPosts.json();
        } catch (e) {}

        const allFiles = [...filesRoot, ...filesPosts];
        const mdFiles = allFiles.filter(f => f.name.endsWith('.md') && f.name !== 'README.md');

        if (mdFiles.length === 0) {
          container.innerHTML = '<p>등록된 글이 없습니다.</p>';
          return;
        }

        container.innerHTML = '';
        for (const file of mdFiles) {
          const contentRes = await fetch(file.download_url);
          const text = await contentRes.text();
          
          // 간단한 제목 추출
          const titleMatch = text.match(/title:\s*["']?(.*?)["']?$/m) || text.match(/^#\s+(.*)$/m);
          const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
          
          const card = document.createElement('div');
          card.className = 'post-card';
          card.innerHTML = `
            <div class="post-title">${title}</div>
            <div class="post-date">발행 완료</div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        container.innerHTML = '<p>글을 불러오는 도중 오류가 발생했습니다.</p>';
      }
    }
    loadPosts();
  </script>
</body>
</html>

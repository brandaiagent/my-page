<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Ai Agent - 쇼핑 큐레이션</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f5f4f1;
      --surface: #fbfaf8;
      --ink: #1b1b1c;
      --ink-sub: #55524d;
      --ink-muted: #8f8b84;
      --line: #dcd8d1;
      --accent: #8a6d3f;
      --chip: #ebe8e2;
      --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0f; --surface: #151516; --ink: #efece6; --ink-sub: #b5b0a6;
        --ink-muted: #7d786f; --line: #2a2a2b; --accent: #c8a96b; --chip: #1e1e1f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--ink);
      line-height: 1.7; letter-spacing: -0.01em; word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }
    a:focus-visible, button:focus-visible, .post-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .gnb { position: sticky; top: 0; z-index: 100; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .gnb-top { max-width: 1180px; margin: 0 auto; padding: 22px 32px; display: flex; justify-content: space-between; align-items: baseline; }
    .logo { font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: 0.06em; color: var(--ink); cursor: pointer; text-decoration: none; }
    .admin-link { font-size: 0.82rem; color: var(--ink-muted); text-decoration: none; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
    .admin-link:hover { color: var(--ink); border-color: var(--ink); }

    ::selection { background: var(--accent); color: var(--bg); }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 32px 120px; }

    .promo-banner { padding: clamp(56px, 11vw, 128px) 0 clamp(48px, 8vw, 88px); border-bottom: 1px solid var(--line); margin-bottom: 48px; }
    .promo-banner h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.4rem, 7vw, 5.2rem); line-height: 1.2; letter-spacing: -0.04em; }
    .promo-banner p::before { content: ''; display: block; width: 40px; height: 1px; background: var(--accent); margin-bottom: 24px; }
    .promo-banner p { margin-top: 48px; font-size: 1rem; color: var(--ink-sub); max-width: 30em; }

    .filters { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 36px; }
    .chip { font: inherit; font-size: 0.92rem; cursor: pointer; background: none; border: 0; padding: 4px 0; color: var(--ink-muted); border-bottom: 1px solid transparent; transition: color .2s; }
    .chip:hover { color: var(--ink); }
    .chip.active { color: var(--ink); border-bottom-color: var(--accent); }

    .post-grid { display: grid; gap: 72px 40px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    a.post-card { color: inherit; text-decoration: none; }
    .post-card { cursor: pointer; display: flex; flex-direction: column; }
    .card-thumb { aspect-ratio: 4 / 5; overflow: hidden; background: var(--chip); display: flex; align-items: center; justify-content: center; }
    @keyframes imgin { from { opacity: 0; } to { opacity: 1; } }
    .card-thumb img { animation: imgin .7s ease both; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s cubic-bezier(.2,.6,.2,1); }
    .post-card:hover .card-thumb img { transform: scale(1.04); }
    .post-card .card-more { transition: color .3s, letter-spacing .3s; }
    .post-card:hover .card-more { color: var(--accent); letter-spacing: 0.02em; }
    .card-initial { font-family: var(--serif); font-size: 4rem; font-weight: 300; color: var(--ink-muted); opacity: .6; }
    .card-body { padding-top: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-tag { align-self: flex-start; font-size: 0.8rem; color: var(--accent); margin-bottom: 10px; }
    .card-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; line-height: 1.55; letter-spacing: -0.025em; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; background: linear-gradient(var(--ink), var(--ink)) 0 100% / 0 1px no-repeat; transition: background-size .35s; align-self: flex-start; }
    .post-card:hover .card-title { background-size: 100% 1px; }
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink-muted); padding-top: 14px; border-top: 1px solid var(--line); }
    .card-more { color: var(--ink-sub); }

    @media (min-width: 900px) {
      .post-grid.has-feature .post-card:first-child { grid-column: 1 / -1; flex-direction: row; gap: 56px; align-items: center; padding-bottom: 56px; border-bottom: 1px solid var(--line); }
      .post-grid.has-feature .post-card:first-child .card-thumb { aspect-ratio: 4 / 3; flex: 1.2; }
      .post-grid.has-feature .post-card:first-child .card-body { flex: 1; padding-top: 0; flex-grow: 0; }
      .post-grid.has-feature .post-card:first-child .card-title { font-size: 2rem; line-height: 1.4; -webkit-line-clamp: 4; }
      .post-grid.has-feature .post-card:first-child .card-footer { margin-top: 32px; }
    }

    .state-msg { text-align: center; padding: 96px 0; color: var(--ink-muted); }

    .back-btn { display: inline-block; margin: 40px 0 32px; font: inherit; font-size: 0.88rem; cursor: pointer; color: var(--ink-muted); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0 0 3px; transition: color .2s; }
    .back-btn:hover { color: var(--ink); }
    .detail-container { max-width: 720px; margin: 0 auto; padding: 0 0 24px; }
    .detail-meta { display: flex; gap: 14px; margin-bottom: 20px; font-size: 0.85rem; color: var(--ink-muted); }
    .detail-meta .card-tag { margin: 0; }
    .detail-title { font-family: var(--serif); font-size: clamp(1.9rem, 4.6vw, 2.9rem); font-weight: 400; line-height: 1.4; letter-spacing: -0.035em; margin-bottom: 40px; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
    #content-area { font-size: 1.04rem; color: var(--ink-sub); line-height: 1.95; }
    #content-area > * + * { margin-top: 1.2em; }
    #content-area h1, #content-area h2, #content-area h3 { font-family: var(--serif); color: var(--ink); font-weight: 500; line-height: 1.4; letter-spacing: -0.02em; margin-top: 2.4em; }
    #content-area h2 { font-size: 1.55rem; }
    #content-area h3 { font-size: 1.22rem; }
    #content-area strong { color: var(--ink); font-weight: 600; }
    #content-area a { color: var(--accent); text-underline-offset: 4px; }
    #content-area ul, #content-area ol { padding-left: 1.3em; }
    #content-area li + li { margin-top: .5em; }
    #content-area blockquote { border-left: 1px solid var(--accent); padding: 2px 0 2px 22px; color: var(--ink); font-family: var(--serif); }
    #content-area hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
    #content-area img { max-width: 100%; height: auto; display: block; margin: 36px auto; }
    #content-area .table-wrap { overflow-x: auto; }
    #content-area table { border-collapse: collapse; width: 100%; font-size: .94rem; }
    #content-area th, #content-area td { border-bottom: 1px solid var(--line); padding: 12px 10px; text-align: left; }
    #content-area th { color: var(--ink); font-weight: 600; }
    #content-area code { background: var(--chip); padding: 2px 6px; font-size: .9em; }

    #progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 200; }
    .site-footer { max-width: 1180px; margin: 0 auto; padding: 32px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink-muted); }
    .site-footer .f-logo { font-family: var(--serif); letter-spacing: 0.06em; color: var(--ink-sub); }
    @media (prefers-reduced-motion: no-preference) {
      .promo-banner h1 { animation: fade 1s ease both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
    @media (max-width: 600px) {
      .gnb-top, .container, .site-footer { padding-left: 20px; padding-right: 20px; }
      .site-footer { flex-direction: column; gap: 6px; }
      .post-grid { gap: 44px 0; }
    }
  </style>
</head>
<body>

  <header class="gnb">
    <div class="gnb-top">
      <a class="logo" onclick="goHome()">Brand Ai Agent</a>
      <a class="admin-link" href="/admin" target="_blank">관리자</a>
    </div>
  </header>

  <div class="container">
    <section class="promo-banner" id="promo-section">
      <h1>오래 쓸 물건을,<br>합리적인 가격에.</h1>
      <p>Brand Ai Agent가 가격 대비 만족도가 높은 제품만 골라 정리합니다.</p>
    </section>

    <main id="app">
      <div class="state-msg">글 목록을 조회 중입니다...</div>
    </main>
  </div>

  <footer class="site-footer"><span class="f-logo">Brand Ai Agent</span><span>가격 대비 만족도 높은 제품 큐레이션</span></footer>
  <div id="progress"></div>

  <script>
    window.addEventListener('scroll', () => {
      const h = document.documentElement.scrollHeight - innerHeight;
      document.getElementById('progress').style.width = (document.getElementById('content-area') && h > 0 ? scrollY / h * 100 : 0) + '%';
    }, { passive: true });
    let activePosts = [];
    let activeFilter = '전체';

    // ---- frontmatter helpers (display only) ----
    function getFrontmatter(text) {
      const m = text.match(/^---\s*\n([\s\S]*?)\n---/);
      return m ? m[1] : '';
    }
    function getField(text, keys) {
      const fm = getFrontmatter(text);
      for (const key of keys) {
        const m = fm.match(new RegExp('^' + key + ':\\s*["\']?(.*?)["\']?\\s*$', 'm'));
        if (m && m[1]) return m[1];
      }
      return '';
    }
    function fixImagePath(src) {
      if (!src || /^https?:\/\//.test(src)) return src;
      return './' + src.replace(/^\.?\//, '');
    }
    function formatDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.getFullYear() + '.' + String(dt.getMonth() + 1).padStart(2, '0') + '.' + String(dt.getDate()).padStart(2, '0');
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // 1순위: 빌드 때 만든 posts.json (GitHub API 호출 제한 없음)
    async function loadFromJson() {
      try {
        const res = await fetch('/posts.json', { cache: 'no-cache' });
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data) ? data : null;
      } catch (e) { return null; }
    }

    // 2순위(백업): posts.json이 없을 때만 GitHub API 사용
    async function loadFromGithub() {
      const resRoot = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/');
      const filesRoot = resRoot.ok ? await resRoot.json() : [];
      let filesPosts = [];
      try {
        const resPosts = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/posts');
        if (resPosts.ok) filesPosts = await resPosts.json();
      } catch (e) {}
      const allFiles = [...(Array.isArray(filesRoot) ? filesRoot : []), ...(Array.isArray(filesPosts) ? filesPosts : [])];
      const mdFiles = allFiles.filter(f => f.name && f.name.endsWith('.md') && f.name !== 'README.md');
      const out = [];
      for (const file of mdFiles) {
        const text = await (await fetch(file.download_url)).text();
        out.push({ name: file.name, text });
      }
      return out;
    }

    async function loadRealPosts() {
      const app = document.getElementById('app');
      try {
        let sources = await loadFromJson();
        if (!sources) sources = await loadFromGithub();

        if (sources.length === 0) {
          app.innerHTML = '<div class="state-msg">아직 등록된 글이 없습니다. 관리자(CMS)에서 첫 글을 발행해 보세요.</div>';
          return;
        }

        activePosts = sources.map(({ name, text, slug }) => {
          const titleMatch = text.match(/title:\s*["']?(.*?)["']?$/m) || text.match(/^#\s+(.*)$/m);
          return {
            name: name,
            slug: slug || '',
            title: titleMatch ? titleMatch[1] : name.replace('.md', ''),
            text: text,
            category: getField(text, ['category', 'tag']) || '큐레이션',
            date: getField(text, ['date']),
            thumb: fixImagePath(getField(text, ['thumbnail', 'image', 'cover']))
          };
        });


        // 최신 글이 먼저 오도록 날짜 정렬 (날짜 없는 글은 기존 순서 유지)
        activePosts.sort((a, b) => (new Date(b.date) || 0) - (new Date(a.date) || 0) || 0);

        renderGrid();
      } catch (err) {
        app.innerHTML = '<div class="state-msg">글 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
      }
    }

    function setFilter(cat) {
      activeFilter = cat;
      renderGrid();
    }

    function renderGrid() {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'block';

      const app = document.getElementById('app');
      const cats = ['전체', ...new Set(activePosts.map(p => p.category))];

      let html = '';
      if (cats.length > 2) {
        html += '<div class="filters">' + cats.map(c =>
          `<button class="chip ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`
        ).join('') + '</div>';
      } else {
        activeFilter = '전체';
      }

      const visible = activePosts
        .map((post, idx) => ({ post, idx }))
        .filter(({ post }) => activeFilter === '전체' || post.category === activeFilter);

      html += `<div class="post-grid ${activeFilter === '전체' && visible.length > 2 ? 'has-feature' : ''}">`;
      visible.forEach(({ post, idx }) => {
        const thumb = post.thumb
          ? `<img src="${escapeHtml(post.thumb)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<span class=card-initial>${escapeHtml(post.title.charAt(0))}</span>'" />`
          : `<span class="card-initial">${escapeHtml(post.title.charAt(0))}</span>`;
        const href = post.slug ? `/p/${post.slug}/` : '#';
        const click = post.slug ? '' : ` onclick="viewPost(${idx}); return false;"`;
        html += `
          <a class="post-card" href="${href}"${click}>
            <div class="card-thumb">${thumb}</div>
            <div class="card-body">
              <span class="card-tag">${escapeHtml(post.category)}</span>
              <h2 class="card-title">${escapeHtml(post.title)}</h2>
              <div class="card-footer">
                <span>${post.date ? formatDate(post.date) : '발행 완료'}</span>
                <span class="card-more">자세히 보기</span>
              </div>
            </div>
          </a>
        `;
      });
      html += '</div>';
      app.innerHTML = html;
    }

    function viewPost(idx) {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'none';

      const app = document.getElementById('app');
      const post = activePosts[idx];

      const parts = post.text.split('---');
      let markdownBody = parts.length >= 3 ? parts.slice(2).join('---') : post.text;

      markdownBody = markdownBody.replace(/src=["']?images\//g, 'src="./images/')
                                 .replace(/\]\(\s*images\//g, '](./images/')
                                 .replace(/\]\(\s*\/images\//g, '](./images/');

      const htmlContent = window.marked ? marked.parse(markdownBody) : markdownBody;

      app.innerHTML = `
        <button class="back-btn" onclick="renderGrid(); window.scrollTo(0, 0);">&larr; 목록으로</button>
        <article class="detail-container">
          <div class="detail-meta">
            <span class="card-tag">${escapeHtml(post.category)}</span>
            ${post.date ? `<span>${formatDate(post.date)}</span>` : ''}
          </div>
          <h1 class="detail-title">${escapeHtml(post.title)}</h1>
          <div id="content-area">${htmlContent}</div>
        </article>
      `;

      // 표가 좁은 화면에서 넘치지 않도록 감싸기
      document.querySelectorAll('#content-area table').forEach(t => {
        const w = document.createElement('div');
        w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      window.scrollTo(0, 0);
    }

    function goHome() {
      activeFilter = '전체';
      renderGrid();
      window.scrollTo(0, 0);
    }

    loadRealPosts();
  </script>
</body>
</html>

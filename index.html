<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Ai Agent - 쇼핑 큐레이션</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
    }

    /* 상단 GNB 바 */
    .gnb {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .gnb-top {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      letter-spacing: -0.03em;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 24px;
      padding: 8px 16px;
      width: 320px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .search-box:focus-within {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
    }
    .admin-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
    }

    /* 하위 카테고리 네비게이션 메뉴 */
    .gnb-nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 32px;
      overflow-x: auto;
    }
    .nav-item {
      padding: 12px 0;
      font-size: 0.95rem;
      font-weight: 700;

<!DOCTYPE html>
<html lang="ko" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Ai Agent - 쇼핑 큐레이션</title>
  <meta name="description" content="Brand Ai Agent가 가격 대비 만족도가 높은 제품만 골라 정리합니다." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Brand Ai Agent" />
  <meta property="og:title" content="Brand Ai Agent - 쇼핑 큐레이션" />
  <meta property="og:description" content="Brand Ai Agent가 가격 대비 만족도가 높은 제품만 골라 정리합니다." />
  <meta property="og:url" content="https://my-page-eyb.pages.dev/" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:image" content="https://my-page-eyb.pages.dev/images/cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #F3F4F1; --surface: #FFFFFF; --ink: #0F1412; --ink-sub: #3F4743;
      --ink-muted: #626B67; --line: #D9DCD6; --accent: #1D5C43; --chip: #E6E9E3;
      --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0B0F0D; --surface: #121715; --ink: #EEF1ED; --ink-sub: #B3BAB5; --ink-muted: #8A948F; --line: #242B27; --accent: #7CCBA0; --chip: #1A211E; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-padding-top: 80px; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.7; letter-spacing: -0.01em; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a:focus-visible, button:focus-visible, .post-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    ::selection { background: var(--accent); color: var(--bg); }

    .gnb { position: sticky; top: 0; z-index: 100; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color .3s; }
    .gnb.s { border-bottom-color: var(--line); }
    .gnb-top { max-width: 1240px; margin: 0 auto; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; transition: padding .3s; }
    .gnb.s .gnb-top { padding-top: 14px; padding-bottom: 14px; }
    .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); cursor: pointer; text-decoration: none; }
    .logo::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 4px; background: var(--accent); border-radius: 50%; }
    .admin-link { font-size: 0.86rem; font-weight: 500; color: var(--ink-sub); text-decoration: none; padding: 8px 16px; border: 1px solid var(--line); border-radius: 4px; transition: background .2s, color .2s, border-color .2s; }
    .admin-link:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .container { max-width: 1240px; margin: 0 auto; padding: 0 40px 128px; }
    .promo-banner { display: grid; grid-template-columns: 1.6fr 1fr; gap: 48px; align-items: end; padding: clamp(56px, 11vw, 136px) 0 clamp(48px, 8vw, 96px); border-bottom: 1px solid var(--line); margin-bottom: 56px; }
    .promo-banner h1 { font-weight: 800; font-size: clamp(2.5rem, 7.2vw, 6.2rem); line-height: 1.1; letter-spacing: -0.055em; }
    .hero-side p { font-size: 1.05rem; color: var(--ink-sub); max-width: 26em; }
    .hero-side p::before { content: ''; display: block; width: 40px; height: 2px; background: var(--accent); margin-bottom: 24px; }
    .hero-meta { display: block; margin-top: 20px; font-size: 0.88rem; font-weight: 500; color: var(--accent); }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 48px; }
    .chip { font: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 7px 16px; color: var(--ink-sub); transition: background .2s, color .2s, border-color .2s; }
    .chip:hover { border-color: var(--ink); color: var(--ink); }
    .chip.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    .post-grid { display: grid; gap: 72px 40px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    a.post-card { color: inherit; text-decoration: none; }
    .post-card { cursor: pointer; display: flex; flex-direction: column; }
    .card-thumb { aspect-ratio: 4 / 5; overflow: hidden; background: var(--chip); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    @keyframes imgin { from { opacity: 0; } to { opacity: 1; } }
    .card-thumb img { animation: imgin .7s ease both; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s cubic-bezier(.2,.6,.2,1); }
    .post-card:hover .card-thumb img { transform: scale(1.05); }
    .card-initial { font-weight: 800; font-size: 4rem; color: var(--ink-muted); opacity: .5; }
    .card-body { padding-top: 22px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-tag { align-self: flex-start; font-size: 0.82rem; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
    .card-title { font-size: 1.22rem; font-weight: 700; line-height: 1.5; letter-spacing: -0.03em; margin-bottom: 24px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; background: linear-gradient(var(--accent), var(--accent)) 0 100% / 0 2px no-repeat; transition: background-size .35s; align-self: flex-start; }
    .post-card:hover .card-title { background-size: 100% 2px; }
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--ink-muted); padding-top: 14px; border-top: 1px solid var(--line); }
    .card-more { color: var(--ink-sub); font-weight: 500; transition: color .3s; }
    .post-card:hover .card-more { color: var(--accent); }

    @media (min-width: 900px) {
      .post-grid.has-feature .post-card:first-child { grid-column: 1 / -1; flex-direction: row; gap: 64px; align-items: center; padding-bottom: 64px; border-bottom: 1px solid var(--line); }
      .post-grid.has-feature .post-card:first-child .card-thumb { aspect-ratio: 4 / 3; flex: 1.3; }
      .post-grid.has-feature .post-card:first-child .card-body { flex: 1; padding-top: 0; flex-grow: 0; }
      .post-grid.has-feature .post-card:first-child .card-title { font-size: 2.3rem; font-weight: 800; line-height: 1.32; letter-spacing: -0.045em; -webkit-line-clamp: 4; }
      .post-grid.has-feature .post-card:first-child .card-footer { margin-top: 32px; }
    }
    .state-msg { text-align: center; padding: 96px 0; color: var(--ink-muted); }

    .back-btn { display: inline-block; margin: 40px 0 40px; font: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; color: var(--ink-sub); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0 0 3px; transition: color .2s, border-color .2s; }
    .back-btn:hover { color: var(--ink); border-color: var(--ink); }
    .detail-container { max-width: 740px; margin: 0 auto; padding: 0 0 24px; }
    .detail-meta { display: flex; gap: 14px; margin-bottom: 24px; font-size: 0.88rem; color: var(--ink-muted); }
    .detail-meta .card-tag { margin: 0; }
    .detail-title { font-size: clamp(2rem, 5.4vw, 3.5rem); font-weight: 800; line-height: 1.25; letter-spacing: -0.05em; margin-bottom: 48px; padding-bottom: 40px; border-bottom: 1px solid var(--line); }
    #content-area { font-family: var(--serif); font-size: 1.1rem; color: var(--ink-sub); line-height: 2; }
    #content-area > * + * { margin-top: 1.3em; }
    #content-area h1, #content-area h2, #content-area h3 { font-family: var(--font); color: var(--ink); font-weight: 800; line-height: 1.4; letter-spacing: -0.035em; margin-top: 2.6em; }
    #content-area h2 { font-size: 1.7rem; }
    #content-area h3 { font-size: 1.3rem; }
    #content-area strong { color: var(--ink); font-weight: 700; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 22%, transparent) 62%); }
    #content-area a { color: var(--accent); text-underline-offset: 4px; }
    #content-area ul, #content-area ol { padding-left: 1.3em; }
    #content-area li + li { margin-top: .5em; }
    #content-area blockquote { border-left: 3px solid var(--accent); padding: 4px 0 4px 26px; color: var(--ink); font-size: 1.3rem; font-weight: 500; line-height: 1.7; }
    #content-area hr { border: 0; border-top: 1px solid var(--line); margin: 2.6em 0; }
    #content-area img { max-width: 100%; height: auto; display: block; margin: 40px auto; border-radius: 4px; }
    #content-area .table-wrap { overflow-x: auto; }
    #content-area table { border-collapse: collapse; width: 100%; min-width: 480px; font-family: var(--font); font-size: .95rem; }
    #content-area th, #content-area td { border-bottom: 1px solid var(--line); padding: 14px 12px; text-align: left; }
    #content-area th { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--ink); }
    #content-area code { background: var(--chip); padding: 2px 6px; font-size: .9em; border-radius: 3px; }

    #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 200; }
    .site-footer { max-width: 1240px; margin: 0 auto; padding: 48px 40px 56px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; font-size: 0.86rem; color: var(--ink-muted); }
    .site-footer .f-logo { display: block; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); margin-bottom: 8px; }
    @media (prefers-reduced-motion: no-preference) {
      .promo-banner h1 { animation: fade 1s cubic-bezier(.2,.7,.1,1) both; }
      .hero-side { animation: fade 1s .15s cubic-bezier(.2,.7,.1,1) both; }
      @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .post-card.rv { opacity: 0; transform: translateY(16px); transition: opacity .7s, transform .7s; }
      .post-card.rv.in { opacity: 1; transform: none; }
      #app.enter { animation: fade .5s both; }
    }
    @media (max-width: 900px) { .promo-banner { grid-template-columns: 1fr; gap: 32px; } }
    @media (max-width: 600px) {
      .gnb-top, .container, .site-footer { padding-left: 20px; padding-right: 20px; }
      .site-footer { flex-direction: column; align-items: flex-start; gap: 12px; }
      .post-grid { gap: 52px 0; }
    }
  </style>
</head>
<body>

  <header class="gnb">
    <div class="gnb-top">
      <a class="logo" onclick="goHome()">Brand Ai Agent</a>
      <a class="admin-link" href="/admin" target="_blank">관리자</a>
    </div>
  </header>

  <div class="container">
    <section class="promo-banner" id="promo-section">
      <h1>오래 쓸 물건을,<br>합리적인 가격에.</h1>
      <div class="hero-side">
        <p>Brand Ai Agent가 가격 대비 만족도가 높은 제품만 골라 정리합니다.</p>
        <span class="hero-meta" id="hero-meta"></span>
      </div>
    </section>

    <main id="app">
      <div class="state-msg">글 목록을 조회 중입니다...</div>
    </main>
  </div>

  <footer class="site-footer"><div><span class="f-logo">Brand Ai Agent</span><span>가격 대비 만족도 높은 제품 큐레이션</span></div><span>© 2026 Brand Ai Agent</span></footer>
  <div id="progress"></div>

  <script>
    window.addEventListener('scroll', () => {
      document.querySelector('.gnb').classList.toggle('s', scrollY > 40);
      const h = document.documentElement.scrollHeight - innerHeight;
      document.getElementById('progress').style.width = (document.getElementById('content-area') && h > 0 ? scrollY / h * 100 : 0) + '%';
    }, { passive: true });
    let activePosts = [];
    let activeFilter = '전체';

    // ---- frontmatter helpers (display only) ----
    function getFrontmatter(text) {
      const m = text.match(/^---\s*\n([\s\S]*?)\n---/);
      return m ? m[1] : '';
    }
    function getField(text, keys) {
      const fm = getFrontmatter(text);
      for (const key of keys) {
        const m = fm.match(new RegExp('^' + key + ':\\s*["\']?(.*?)["\']?\\s*$', 'm'));
        if (m && m[1]) return m[1];
      }
      return '';
    }
    function fixImagePath(src) {
      if (!src || /^https?:\/\//.test(src)) return src;
      return './' + src.replace(/^\.?\//, '');
    }
    function formatDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.getFullYear() + '.' + String(dt.getMonth() + 1).padStart(2, '0') + '.' + String(dt.getDate()).padStart(2, '0');
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // 1순위: 빌드 때 만든 posts.json (GitHub API 호출 제한 없음)
    async function loadFromJson() {
      try {
        const res = await fetch('/posts.json', { cache: 'no-cache' });
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data) ? data : null;
      } catch (e) { return null; }
    }

    // 2순위(백업): posts.json이 없을 때만 GitHub API 사용
    async function loadFromGithub() {
      const resRoot = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/');
      const filesRoot = resRoot.ok ? await resRoot.json() : [];
      let filesPosts = [];
      try {
        const resPosts = await fetch('https://api.github.com/repos/brandaiagent/my-page/contents/posts');
        if (resPosts.ok) filesPosts = await resPosts.json();
      } catch (e) {}
      const allFiles = [...(Array.isArray(filesRoot) ? filesRoot : []), ...(Array.isArray(filesPosts) ? filesPosts : [])];
      const mdFiles = allFiles.filter(f => f.name && f.name.endsWith('.md') && f.name !== 'README.md');
      const out = [];
      for (const file of mdFiles) {
        const text = await (await fetch(file.download_url)).text();
        out.push({ name: file.name, text });
      }
      return out;
    }

    async function loadRealPosts() {
      const app = document.getElementById('app');
      try {
        let sources = await loadFromJson();
        if (!sources) sources = await loadFromGithub();

        if (sources.length === 0) {
          app.innerHTML = '<div class="state-msg">아직 등록된 글이 없습니다. 관리자(CMS)에서 첫 글을 발행해 보세요.</div>';
          return;
        }

        activePosts = sources.map(({ name, text, slug }) => {
          const titleMatch = text.match(/title:\s*["']?(.*?)["']?$/m) || text.match(/^#\s+(.*)$/m);
          return {
            name: name,
            slug: slug || '',
            title: titleMatch ? titleMatch[1] : name.replace('.md', ''),
            text: text,
            category: getField(text, ['category', 'tag']) || '큐레이션',
            date: getField(text, ['date']),
            thumb: fixImagePath(getField(text, ['thumbnail', 'image', 'cover']))
          };
        });


        // 최신 글이 먼저 오도록 날짜 정렬 (날짜 없는 글은 기존 순서 유지)
        activePosts.sort((a, b) => (new Date(b.date) || 0) - (new Date(a.date) || 0) || 0);

        renderGrid();
      } catch (err) {
        app.innerHTML = '<div class="state-msg">글 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
      }
    }

    function setFilter(cat) {
      activeFilter = cat;
      renderGrid();
    }

    function renderGrid() {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'block';

      const app = document.getElementById('app');
      const cats = ['전체', ...new Set(activePosts.map(p => p.category))];

      let html = '';
      if (cats.length > 2) {
        html += '<div class="filters">' + cats.map(c =>
          `<button class="chip ${c === activeFilter ? 'active' : ''}" onclick="setFilter('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>`
        ).join('') + '</div>';
      } else {
        activeFilter = '전체';
      }

      const visible = activePosts
        .map((post, idx) => ({ post, idx }))
        .filter(({ post }) => activeFilter === '전체' || post.category === activeFilter);

      html += `<div class="post-grid ${activeFilter === '전체' && visible.length > 2 ? 'has-feature' : ''}">`;
      visible.forEach(({ post, idx }) => {
        const thumb = post.thumb
          ? `<img src="${escapeHtml(post.thumb)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<span class=card-initial>${escapeHtml(post.title.charAt(0))}</span>'" />`
          : `<span class="card-initial">${escapeHtml(post.title.charAt(0))}</span>`;
        const href = post.slug ? `/p/${post.slug}/` : '#';
        const click = post.slug ? '' : ` onclick="viewPost(${idx}); return false;"`;
        html += `
          <a class="post-card" href="${href}"${click}>
            <div class="card-thumb">${thumb}</div>
            <div class="card-body">
              <span class="card-tag">${escapeHtml(post.category)}</span>
              <h2 class="card-title">${escapeHtml(post.title)}</h2>
              <div class="card-footer">
                <span>${post.date ? formatDate(post.date) : '발행 완료'}</span>
                <span class="card-more">자세히 보기</span>
              </div>
            </div>
          </a>
        `;
      });
      html += '</div>';
      app.innerHTML = html;
      const hm = document.getElementById('hero-meta');
      if (hm) hm.textContent = '지금까지 ' + activePosts.length + '편의 큐레이션';
      app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
      const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
      app.querySelectorAll('.post-card').forEach(c => { c.classList.add('rv'); io.observe(c); });
    }

    function viewPost(idx) {
      const promo = document.getElementById('promo-section');
      if (promo) promo.style.display = 'none';

      const app = document.getElementById('app');
      const post = activePosts[idx];

      const parts = post.text.split('---');
      let markdownBody = parts.length >= 3 ? parts.slice(2).join('---') : post.text;

      markdownBody = markdownBody.replace(/src=["']?images\//g, 'src="./images/')
                                 .replace(/\]\(\s*images\//g, '](./images/')
                                 .replace(/\]\(\s*\/images\//g, '](./images/');

      const htmlContent = window.marked ? marked.parse(markdownBody) : markdownBody;

      app.innerHTML = `
        <button class="back-btn" onclick="renderGrid(); window.scrollTo(0, 0);">&larr; 목록으로</button>
        <article class="detail-container">
          <div class="detail-meta">
            <span class="card-tag">${escapeHtml(post.category)}</span>
            ${post.date ? `<span>${formatDate(post.date)}</span>` : ''}
          </div>
          <h1 class="detail-title">${escapeHtml(post.title)}</h1>
          <div id="content-area">${htmlContent}</div>
        </article>
      `;

      // 표가 좁은 화면에서 넘치지 않도록 감싸기
      document.querySelectorAll('#content-area table').forEach(t => {
        const w = document.createElement('div');
        w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
      window.scrollTo(0, 0);
    }

    function goHome() {
      activeFilter = '전체';
      renderGrid();
      window.scrollTo(0, 0);
    }

    loadRealPosts();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가성비 쇼핑 큐레이션</title>
  <!-- 눈누 프리텐다드(Pretendard) 웹폰트 적용 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.7;
      word-break: keep-all;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
    }

    /* Header & Hero Section */
    header {
      text-align: center;
      padding: 40px 24px;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .site-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 12px 0;
      color: var(--text-main);
      cursor: pointer;
      display: inline-block;
      transition: opacity 0.2s;
    }

    .site-title:hover {
      opacity: 0.8;
    }

    .site-sub {
      font-size: 1rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 400;
    }

    /* Post Cards */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      position: relative;
      overflow: hidden;
    }

    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      border-color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      background-color: #eff6ff;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .post-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
    }

    .post-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Back Button & Detail View */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #f1f5f9;
      color: var(--primary-hover);
    }

    .detail-container {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    }

    .detail-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-top: 0;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
    }

    /* Markdown Article Formatting */
    #content-area {
      font-size: 1.05rem;
      color: #334155;
    }

    #content-area h1, #content-area h2, #content-area h3 {
      color: var(--text-main);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 36px;
      margin-bottom: 16px;
    }

    #content-area img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 28px auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    #content-area blockquote {
      margin: 24px 0;
      padding: 16px 20px;
      background-color: #f8fafc;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      color: #475569;
    }

    #content-area a {
      color: var(--primary);
      text-decoration: underline;
    }

    /* Loading & Error */
    .status-msg {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="site-title" onclick="goHome()">가성비 쇼핑 큐레이션</div>
      <p class="site-sub

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;900&family=Black+Han+Sans&display=block" rel="stylesheet">
<style>*{margin:0}body{width:1080px;height:1350px;background:#f3ece1;font-family:'Noto Sans KR';display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.box{width:820px;height:560px;background:linear-gradient(180deg,#d2a46b,#c08f55);border-radius:18px;position:relative;box-shadow:0 30px 60px rgba(80,50,20,.35);transform:rotate(-3deg)}
.tape{position:absolute;left:350px;top:-10px;width:120px;height:580px;background:rgba(240,225,190,.75)}
.label{position:absolute;left:110px;top:170px;width:600px;padding:34px 20px;background:#fff;border:6px solid #e0262b;border-radius:10px;text-align:center}
.label b{display:block;font-weight:900;font-size:62px;color:#e0262b;letter-spacing:-2px}
.x{position:absolute;left:60px;top:120px;width:700px;height:300px}
.t{margin-top:90px;text-align:center;font-family:'Black Han Sans';font-size:92px;line-height:1.15;color:#1c1c1c;letter-spacing:-2px}
.t span{color:#e0262b}
</style></head><body>
<div class="box"><div class="tape"></div><div class="label"><b>포장 개봉 시<br>반품 불가</b></div>
<svg class="x" viewBox="0 0 700 300"><path d="M40 30 L660 270" stroke="#111" stroke-width="22" stroke-linecap="round"/></svg></div>
<div class="t">이 문구, 대부분<br><span>효력 없어요</span></div>
</body></html>

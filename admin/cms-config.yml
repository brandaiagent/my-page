backend:
  name: github
  repo: brandaiagent/my-page
  branch: main

site_url: https://my-page-eyb.pages.dev
display_url: https://my-page-eyb.pages.dev

media_folder: images
public_folder: /images

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: .
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 작성일, name: date, widget: string, required: false, hint: "손대지 마세요" }
      - { label: 수정일, name: updated, widget: string, required: false, hint: "고친 날짜로 바꾸려면 2026-11-11 형식으로 적으세요" }
      - { label: 카테고리, name: category, widget: string, default: "큐레이션" }
      - { label: 요약문, name: description, widget: text, required: false, hint: "검색 결과에 보일 문장 (80~150자)" }
      - { label: 제휴 링크 포함, name: affiliate, widget: boolean, default: false }
      - { label: 광고 안내 문구, name: ad_notice, widget: string, required: false }
      - { label: 대표 이미지, name: image, widget: image, required: false }
      - { label: 본문, name: body, widget: markdown }
